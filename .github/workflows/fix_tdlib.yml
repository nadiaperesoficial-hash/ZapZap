name: Fix TDLib

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout ZapZap
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Find and restore original .so files
        run: |
          # Acha o commit anterior ao update do TGX
          COMMIT=$(git log --oneline | grep -v "TGX\|Update libtdjni\|Restore" | head -1 | awk '{print $1}')
          echo "Restaurando do commit: $COMMIT"
          git checkout $COMMIT -- android/app/src/main/jniLibs/
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/jniLibs/
          git diff --staged --quiet || git commit -m "Fix: restore original libtdjni.so"
          git push
